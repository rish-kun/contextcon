[project]
name = "dealproof-api"
version = "0.1.0"
description = "DealProof backend: FastAPI service for discovery, verification and evaluation pipelines."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.15",
    "anthropic>=2.12.0",
    "asyncpg>=0.30",
    "fastapi>=0.165.0",
    "google-cloud-storage>=3.17.1",
    "httpx2>=2.16.2",
    "pydantic-settings>=2.16.3",
    "pypdf>=7.1.1",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "sqlalchemy[asyncio]>=2.0.40",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.0",
    "ruff>=0.17.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
