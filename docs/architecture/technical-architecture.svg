<defs><marker id="ah-db2777" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#db2777"/></marker><marker id="ah-d97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker><marker id="ah-ea580c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ea580c"/></marker><marker id="ah-94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="ah-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="ah-059669" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="ah-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker><marker id="ah-475569" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker></defs><rect width="1500" height="1170" fill="#ffffff"/><text x="20" y="38" class="title" text-anchor="start">DealProof — technical architecture</text><text x="20" y="60" class="sub" text-anchor="start">Components, data flow, and where data calls (D), approvals (A), retries (R) and the cost ledger ($) sit</text><rect x="20" y="76" width="240" height="46" rx="10" fill="#fdf2f8" stroke="#db2777" stroke-width="1.6"/><text x="34" y="101" class="h" text-anchor="start">Analyst / associate</text><rect x="20" y="130" width="240" height="46" rx="10" fill="#fdf2f8" stroke="#db2777" stroke-width="1.6"/><text x="34" y="155" class="h" text-anchor="start">Named approver</text><circle cx="242" cy="148" r="12" fill="#d97706"/><text x="242" y="152.5" class="badge" text-anchor="middle">A</text><rect x="300" y="76" width="860" height="100" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/><text x="314" y="101" class="h" text-anchor="start">Web app — Next.js 16 (apps/web) on Cloud Run, asia-south1</text><text x="314" y="122" class="s" text-anchor="start">Discover · Investors · Case pages: identity, claims, sources, assessment, request, cost</text><text x="314" y="141" class="s" text-anchor="start">Approvals queue · same-origin /api proxy · live run activity over SSE (polling fallback)</text><circle cx="1142" cy="94" r="12" fill="#059669"/><text x="1142" y="98.5" class="badge" text-anchor="middle">$</text><rect x="1200" y="76" width="280" height="100" rx="10" fill="#fdf2f8" stroke="#db2777" stroke-width="1.6"/><text x="1214" y="101" class="h" text-anchor="start">Seller / target company</text><text x="1214" y="122" class="s" text-anchor="start">receives one approved email</text><text x="1214" y="141" class="s" text-anchor="start">returns documents → upload</text><path d="M 260 99 L 298 99" fill="none" stroke="#db2777" stroke-width="2" marker-end="url(#ah-db2777)"/><path d="M 260 153 L 298 153" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#ah-d97706)"/><path d="M 730 176 L 730 210" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ah-475569)"/><text x="740" y="198" class="lab" text-anchor="start">HTTPS JSON + SSE</text><rect x="10" y="212" width="1470" height="600" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="1.6" stroke-dasharray="7 5"/><text x="26" y="236" class="h" text-anchor="start">API service — FastAPI (apps/api), Python 3.12 · the same image runs the step worker · Cloud Run</text><rect x="30" y="250" width="450" height="82" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/><text x="44" y="275" class="h" text-anchor="start">HTTP routers</text><text x="44" y="296" class="s" text-anchor="start">theses · investors · cases · documents · requests (act)</text><text x="44" y="315" class="s" text-anchor="start">runs + activity stream · policy · public showcase</text><rect x="496" y="250" width="450" height="82" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/><text x="510" y="275" class="h" text-anchor="start">Auth &amp; access control</text><text x="510" y="296" class="s" text-anchor="start">named users, sessions, origin check, rate limits</text><text x="510" y="315" class="s" text-anchor="start">case-scoped authorisation on every read path</text><rect x="962" y="250" width="500" height="82" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/><text x="976" y="275" class="h" text-anchor="start">Document intake (seller decks, claims)</text><text x="976" y="296" class="s" text-anchor="start">validate → sandboxed text extraction → PII redaction</text><text x="976" y="315" class="s" text-anchor="start">→ private GCS bucket, case-scoped, 30-day retention</text><rect x="30" y="346" width="1432" height="262" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/><text x="46" y="370" class="h" text-anchor="start">Job engine — every pipeline is a Run of idempotent Steps, persisted in Postgres</text><rect x="46" y="384" width="430" height="206" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/><text x="60" y="409" class="h" text-anchor="start">Step worker (jobs/worker.py)</text><text x="60" y="431" class="s" text-anchor="start">claim: SELECT … FOR UPDATE SKIP LOCKED</text><text x="60" y="451" class="s" text-anchor="start">60 s lease, renewed while the step runs</text><text x="60" y="471" class="s" text-anchor="start">fresh lease_token per claim (fencing)</text><text x="60" y="491" class="s" text-anchor="start">expired leases reclaimed by sweep + claim</text><text x="60" y="511" class="s" text-anchor="start">step retried ≤ 3 attempts (2 s → 120 s)</text><text x="60" y="531" class="s" text-anchor="start">budget spent → skipped_budget (Not checked)</text><text x="60" y="551" class="s" text-anchor="start">pending → running → done|failed|skipped</text><circle cx="458" cy="402" r="12" fill="#7c3aed"/><text x="458" y="406.5" class="badge" text-anchor="middle">R</text><rect x="494" y="384" width="224" height="196" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/><text x="508" y="409" class="h" text-anchor="start">1 · Discover</text><text x="508" y="435" class="s" text-anchor="start">thesis → criteria (LLM)</text><text x="508" y="459" class="s" text-anchor="start">company search (live)</text><text x="508" y="483" class="s" text-anchor="start">must-have gate</text><text x="508" y="507" class="s" text-anchor="start">enrich top N + jobs</text><text x="508" y="531" class="s" text-anchor="start">re-gate → fit rank</text><text x="508" y="555" class="s" text-anchor="start">+ investor discovery</text><circle cx="700" cy="402" r="12" fill="#2563eb"/><text x="700" y="406.5" class="badge" text-anchor="middle">D</text><path d="M 718 420 L 733 420" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#ah-7c3aed)"/><rect x="734" y="384" width="224" height="196" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/><text x="748" y="409" class="h" text-anchor="start">2 · Verify</text><text x="748" y="435" class="s" text-anchor="start">identity guard (blocking)</text><text x="748" y="459" class="s" text-anchor="start">profile · registry · events</text><text x="748" y="483" class="s" text-anchor="start">comparables · claim intake</text><text x="748" y="507" class="s" text-anchor="start">evidence per claim</text><text x="748" y="531" class="s" text-anchor="start">facts (LLM), span-checked</text><text x="748" y="555" class="s" text-anchor="start">status by rule table</text><circle cx="940" cy="402" r="12" fill="#2563eb"/><text x="940" y="406.5" class="badge" text-anchor="middle">D</text><path d="M 958 420 L 973 420" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#ah-7c3aed)"/><rect x="974" y="384" width="224" height="196" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/><text x="988" y="409" class="h" text-anchor="start">3 · Evaluate (rules only)</text><text x="988" y="435" class="s" text-anchor="start">fit + % assessable</text><text x="988" y="459" class="s" text-anchor="start">evidence sufficiency</text><text x="988" y="483" class="s" text-anchor="start">business · financial</text><text x="988" y="507" class="s" text-anchor="start">disposition (4 values)</text><text x="988" y="531" class="s" text-anchor="start">AssessmentVersion + diff</text><text x="988" y="555" class="s" text-anchor="start">DecisionFlip what-if</text><path d="M 1198 420 L 1213 420" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#ah-7c3aed)"/><rect x="1214" y="384" width="224" height="196" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/><text x="1228" y="409" class="h" text-anchor="start">4 · Act</text><text x="1228" y="435" class="s" text-anchor="start">request list (rules)</text><text x="1228" y="459" class="s" text-anchor="start">draft email (LLM)</text><text x="1228" y="483" class="gate" text-anchor="start">◆ APPROVAL GATE</text><text x="1228" y="507" class="s" text-anchor="start">approval bound to revision</text><text x="1228" y="531" class="s" text-anchor="start">send once (send key)</text><text x="1228" y="555" class="s" text-anchor="start">docs back → re-check</text><circle cx="1420" cy="402" r="12" fill="#d97706"/><text x="1420" y="406.5" class="badge" text-anchor="middle">A</text><path d="M 1326.0 580 L 1326.0 588 L 846.0 588 L 846.0 582" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ah-7c3aed)"/><text x="860.0" y="603" class="lab" text-anchor="start">seller documents arrive → affected claims re-checked → new assessment version</text><path d="M 46 470 L 20 470 L 20 852" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#ah-059669)"/><text x="26" y="838" class="lab" text-anchor="start" transform="rotate(0)">claim · lease · state</text><rect x="30" y="652" width="1432" height="146" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="46" y="676" class="h" text-anchor="start">External call layer — CallOperation (clients/base.py): the single path for every paid call</text><circle cx="1438" cy="670" r="12" fill="#2563eb"/><text x="1438" y="674.5" class="badge" text-anchor="middle">D</text><path d="M 730 608 L 730 650" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#ah-2563eb)"/><text x="740" y="636" class="lab" text-anchor="start">every data / model call</text><rect x="46" y="688" width="262" height="98" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/><text x="60" y="713" class="h" text-anchor="start">① Cache lookup</text><text x="60" y="735" class="s" text-anchor="start">request-hash cache</text><text x="60" y="755" class="s" text-anchor="start">case-scoped if private text</text><text x="60" y="775" class="s" text-anchor="start">hit → replay, zero cost</text><path d="M 308 736 L 321 736" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#ah-2563eb)"/><rect x="322" y="688" width="262" height="98" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/><text x="336" y="713" class="h" text-anchor="start">② Pre-dispatch</text><text x="336" y="735" class="s" text-anchor="start">check lease (fencing)</text><text x="336" y="755" class="s" text-anchor="start">reserve case credit budget</text><text x="336" y="775" class="s" text-anchor="start">call_attempt = started</text><path d="M 584 736 L 597 736" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#ah-2563eb)"/><rect x="598" y="688" width="262" height="98" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/><text x="612" y="713" class="h" text-anchor="start">③ Dispatch + retry</text><text x="612" y="735" class="s" text-anchor="start">429 · 5xx · network · timeout</text><text x="612" y="755" class="s" text-anchor="start">exp. backoff + jitter</text><text x="612" y="775" class="s" text-anchor="start">Crustdata ≤3, Claude ≤2</text><circle cx="842" cy="706" r="12" fill="#7c3aed"/><text x="842" y="710.5" class="badge" text-anchor="middle">R</text><path d="M 860 736 L 873 736" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#ah-2563eb)"/><rect x="874" y="688" width="262" height="98" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/><text x="888" y="713" class="h" text-anchor="start">④ Finish (one txn)</text><text x="888" y="735" class="s" text-anchor="start">usage → cost_entries</text><text x="888" y="755" class="s" text-anchor="start">cache write + attempt status</text><text x="888" y="775" class="s" text-anchor="start">lost usage = unknown, not 0</text><circle cx="1118" cy="706" r="12" fill="#059669"/><text x="1118" y="710.5" class="badge" text-anchor="middle">$</text><rect x="1150" y="688" width="296" height="98" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/><text x="1164" y="713" class="h" text-anchor="start">Email sender (Resend)</text><text x="1164" y="735" class="s" text-anchor="start">send key stored before the call</text><text x="1164" y="755" class="s" text-anchor="start">= provider idempotency key</text><text x="1164" y="775" class="s" text-anchor="start">unknown → reconcile, never resend</text><circle cx="1428" cy="706" r="12" fill="#d97706"/><text x="1428" y="710.5" class="badge" text-anchor="middle">A</text><path d="M 1404 580 L 1404 686" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#ah-d97706)"/><rect x="30" y="852" width="780" height="214" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/><text x="44" y="877" class="h" text-anchor="start">Neon Postgres — system of record</text><text x="44" y="902" class="m" text-anchor="start">runs, steps (state, lease_token, attempts)</text><text x="44" y="932" class="m" text-anchor="start">call_attempts: started → succeeded|failed|unknown</text><text x="44" y="962" class="m" text-anchor="start">cost_entries — THE COST LEDGER (credits, tokens, USD)</text><text x="44" y="992" class="m" text-anchor="start">api cache (request hash, case scope)</text><text x="44" y="1022" class="m" text-anchor="start">run_activities (live log shown in the UI)</text><text x="476" y="902" class="m" text-anchor="start">sources, evidence (span, date, origin)</text><text x="476" y="932" class="m" text-anchor="start">claims (original + normalised)</text><text x="476" y="962" class="m" text-anchor="start">assessment_versions (immutable)</text><text x="476" y="992" class="m" text-anchor="start">messages, revisions, approvals</text><text x="476" y="1022" class="m" text-anchor="start">sends (unique send key), deletion log</text><circle cx="32" cy="958" r="12" fill="#059669"/><text x="32" y="962.5" class="badge" text-anchor="middle">$</text><rect x="826" y="852" width="190" height="214" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/><text x="840" y="877" class="h" text-anchor="start">GCS bucket</text><text x="840" y="903" class="s" text-anchor="start">cases/&lt;id&gt;/ uploads</text><text x="840" y="927" class="s" text-anchor="start">private, signed URLs</text><text x="840" y="951" class="s" text-anchor="start">lifecycle delete</text><text x="840" y="975" class="s" text-anchor="start">after 30 days</text><rect x="1032" y="852" width="392" height="124" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/><text x="1046" y="877" class="h" text-anchor="start">Crustdata API — live data</text><text x="1046" y="900" class="m" text-anchor="start">/company/identify  /company/search</text><text x="1046" y="921" class="m" text-anchor="start">/company/enrich    /person/search</text><text x="1046" y="942" class="m" text-anchor="start">/job/search        /web/search/live</text><text x="1046" y="963" class="m" text-anchor="start">/web/enrich/live   (page fetch)</text><circle cx="1406" cy="870" r="12" fill="#2563eb"/><text x="1406" y="874.5" class="badge" text-anchor="middle">D</text><rect x="1032" y="988" width="210" height="78" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/><text x="1046" y="1013" class="h" text-anchor="start">Anthropic Claude</text><text x="1046" y="1035" class="s" text-anchor="start">Haiku 5.5 · extract</text><text x="1046" y="1055" class="s" text-anchor="start">and draft only</text><circle cx="1224" cy="1006" r="12" fill="#2563eb"/><text x="1224" y="1010.5" class="badge" text-anchor="middle">D</text><rect x="1254" y="988" width="208" height="78" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/><text x="1268" y="1013" class="h" text-anchor="start">Resend email</text><text x="1268" y="1035" class="s" text-anchor="start">idempotent send</text><text x="1268" y="1055" class="s" text-anchor="start">test mode by flag</text><circle cx="1444" cy="1006" r="12" fill="#d97706"/><text x="1444" y="1010.5" class="badge" text-anchor="middle">A</text><path d="M 730 786 L 730 826 L 1200 826 L 1200 850" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#ah-2563eb)"/><path d="M 1024 826 L 1024 1027 L 1030 1027" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#ah-2563eb)"/><text x="1210" y="846" class="lab" text-anchor="start">D  live HTTP calls</text><path d="M 1005 786 L 1005 838 L 330 838 L 330 850" fill="none" stroke="#059669" stroke-width="2.2" marker-end="url(#ah-059669)"/><text x="340" y="832" class="lab" text-anchor="start">$ usage + cost per call</text><path d="M 1440 786 L 1440 986" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#ah-d97706)"/><path d="M 1462 1027 L 1490 1027 L 1490 160 L 1482 160" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#ah-d97706)"/><text x="1300" y="205" class="lab" text-anchor="start">approved email, sent once</text><text x="30" y="1110" class="lane" text-anchor="start">LEGEND</text><circle cx="120" cy="1105" r="12" fill="#2563eb"/><text x="120" y="1109.5" class="badge" text-anchor="middle">D</text><text x="140" y="1110" class="s" text-anchor="start">Data call to a live source</text><circle cx="377.6" cy="1105" r="12" fill="#d97706"/><text x="377.6" y="1109.5" class="badge" text-anchor="middle">A</text><text x="397.6" y="1110" class="s" text-anchor="start">Human approval gate</text><circle cx="582.0" cy="1105" r="12" fill="#7c3aed"/><text x="582.0" y="1109.5" class="badge" text-anchor="middle">R</text><text x="602.0" y="1110" class="s" text-anchor="start">Retry / resume point</text><circle cx="794.0" cy="1105" r="12" fill="#059669"/><text x="794.0" y="1109.5" class="badge" text-anchor="middle">$</text><text x="814.0" y="1110" class="s" text-anchor="start">Cost ledger write</text><text x="30" y="1148" class="s" text-anchor="start">Deterministic rules (app/rules, POLICY.md) decide every status, score and disposition; the LLM only extracts and drafts, and each extracted value is checked against its source span.</text></svg>