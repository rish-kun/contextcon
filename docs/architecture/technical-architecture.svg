<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1010" width="1600" height="1010"><style>
text { font-family: 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif; fill: #0f172a; }
.title { font-size: 30px; font-weight: 700; }
.sub { font-size: 17px; fill: #64748b; }
.zone { font-size: 14px; font-weight: 700; fill: #64748b; letter-spacing: 1.6px; }
.h { font-size: 19px; font-weight: 700; }
.s { font-size: 16px; fill: #334155; }
.lab { font-size: 14px; fill: #64748b; }
.num { font-size: 14px; font-weight: 800; fill: #ffffff; }
.big { font-size: 20px; font-weight: 700; }
</style><defs><marker id="a059669" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a2563eb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a475569" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker><marker id="a7c3aed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker><marker id="a94a3b8" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="ad97706" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker><marker id="adb2777" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#db2777"/></marker></defs><rect width="1600" height="1010" fill="#ffffff"/><text x="40" y="52" class="title" text-anchor="start">DealProof · technical architecture</text><text x="40" y="82" class="sub" text-anchor="start">One request flows top to bottom. Badges mark where live data calls, approvals, retries and the cost ledger sit.</text><text x="40" y="128" class="zone" text-anchor="start">1  PEOPLE AND WEB APP</text><rect x="40" y="142" width="220" height="70" rx="12" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/><text x="58" y="174" class="h" text-anchor="start">Analyst</text><text x="58" y="200" class="s" text-anchor="start">asks, reads results</text><rect x="40" y="224" width="220" height="70" rx="12" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/><text x="58" y="256" class="h" text-anchor="start">Approver</text><text x="58" y="282" class="s" text-anchor="start">signs off the email</text><circle cx="240" cy="244" r="13" fill="#d97706"/><text x="240" y="249" class="num" text-anchor="middle">A</text><rect x="320" y="142" width="1000" height="152" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/><text x="338" y="174" class="h" text-anchor="start">Web app</text><text x="338" y="200" class="s" text-anchor="start">Next.js on Cloud Run</text><text x="338" y="222" class="s" text-anchor="start">Discover · case pages (claims, sources, assessment, cost) · approvals queue</text><text x="338" y="244" class="s" text-anchor="start">Live progress of every run</text><path d="M 260 177 L 318 177" fill="none" stroke="#db2777" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#adb2777)"/><path d="M 260 259 L 318 259" fill="none" stroke="#d97706" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#ad97706)"/><rect x="1380" y="142" width="180" height="152" rx="12" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/><text x="1470.0" y="200.0" class="h" text-anchor="middle">Seller</text><text x="1470.0" y="225.0" class="s" text-anchor="middle">gets one</text><text x="1470.0" y="247.0" class="s" text-anchor="middle">approved email</text><path d="M 820 294 L 820 344" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a475569)"/><text x="832" y="324" class="lab" text-anchor="start">HTTPS + live updates</text><text x="40" y="336" class="zone" text-anchor="start">2  API AND JOB ENGINE  (FastAPI on Cloud Run)</text><rect x="40" y="350" width="1280" height="250" rx="16" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/><text x="64" y="386" class="h" text-anchor="start">Job engine</text><text x="176" y="386" class="s" text-anchor="start">Every request is a Run of small Steps saved in Postgres. A worker holds a 60 s lease per step;</text><text x="176" y="410" class="s" text-anchor="start">if the process is killed, another worker resumes the step. A failed step is retried up to 3 times.</text><circle cx="1290" cy="378" r="13" fill="#7c3aed"/><text x="1290" y="383" class="num" text-anchor="middle">R</text><rect x="64" y="440" width="290" height="136" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/><text x="209.0" y="490.0" class="h" text-anchor="middle">Discover</text><text x="209.0" y="515.0" class="s" text-anchor="middle">thesis →</text><text x="209.0" y="537.0" class="s" text-anchor="middle">ranked shortlist</text><path d="M 356 508 L 373 508" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a7c3aed)"/><rect x="375" y="440" width="290" height="136" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/><text x="520.0" y="490.0" class="h" text-anchor="middle">Verify</text><text x="520.0" y="515.0" class="s" text-anchor="middle">identity first, then</text><text x="520.0" y="537.0" class="s" text-anchor="middle">each claim vs. evidence</text><path d="M 667 508 L 684 508" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a7c3aed)"/><rect x="686" y="440" width="290" height="136" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/><text x="831.0" y="490.0" class="h" text-anchor="middle">Evaluate</text><text x="831.0" y="515.0" class="s" text-anchor="middle">fixed rules →</text><text x="831.0" y="537.0" class="s" text-anchor="middle">disposition</text><path d="M 978 508 L 995 508" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a7c3aed)"/><rect x="997" y="440" width="290" height="136" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="1142.0" y="490.0" class="h" text-anchor="middle">Act</text><text x="1142.0" y="515.0" class="s" text-anchor="middle">◆ approval, then</text><text x="1142.0" y="537.0" class="s" text-anchor="middle">send email once</text><circle cx="1267" cy="460" r="13" fill="#d97706"/><text x="1267" y="465" class="num" text-anchor="middle">A</text><path d="M 500 600 L 500 650" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a2563eb)"/><text x="512" y="630" class="lab" text-anchor="start">every paid call goes through one gateway</text><text x="40" y="642" class="zone" text-anchor="start">3  CALL GATEWAY</text><rect x="40" y="656" width="1280" height="128" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><rect x="60" y="674" width="296" height="92" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="78" y="706" class="h" text-anchor="start">1 · Cache</text><text x="78" y="732" class="s" text-anchor="start">already paid? replay free</text><path d="M 357 720 L 371 720" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a2563eb)"/><rect x="372" y="674" width="296" height="92" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="390" y="706" class="h" text-anchor="start">2 · Budget + log</text><text x="390" y="732" class="s" text-anchor="start">reserve credits, log the attempt</text><path d="M 669 720 L 683 720" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a2563eb)"/><rect x="684" y="674" width="296" height="92" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="702" y="706" class="h" text-anchor="start">3 · Call + retry</text><text x="702" y="732" class="s" text-anchor="start">back off on 429 / 5xx</text><circle cx="960" cy="694" r="13" fill="#7c3aed"/><text x="960" y="699" class="num" text-anchor="middle">R</text><circle cx="930" cy="694" r="13" fill="#2563eb"/><text x="930" y="699" class="num" text-anchor="middle">D</text><path d="M 981 720 L 995 720" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a2563eb)"/><rect x="996" y="674" width="296" height="92" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="1014" y="706" class="h" text-anchor="start">4 · Record cost</text><text x="1014" y="732" class="s" text-anchor="start">credits + tokens → ledger</text><circle cx="1272" cy="694" r="13" fill="#059669"/><text x="1272" y="699" class="num" text-anchor="middle">$</text><path d="M 1287.0 508 L 1470 508 L 1470 672" fill="none" stroke="#d97706" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#ad97706)"/><rect x="1380" y="674" width="180" height="92" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="1470.0" y="714.0" class="h" text-anchor="middle">Resend</text><text x="1470.0" y="739.0" class="s" text-anchor="middle">email, idempotent</text><circle cx="1540" cy="694" r="13" fill="#d97706"/><text x="1540" y="699" class="num" text-anchor="middle">A</text><path d="M 1545 674 L 1545 296" fill="none" stroke="#d97706" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#ad97706)"/><text x="1480" y="600" class="lab" text-anchor="start">sent once</text><text x="40" y="826" class="zone" text-anchor="start">4  LIVE SOURCES AND STORAGE</text><rect x="362" y="840" width="300" height="100" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="380" y="872" class="h" text-anchor="start">Crustdata</text><text x="380" y="898" class="s" text-anchor="start">companies, people, jobs, web</text><circle cx="642" cy="860" r="13" fill="#2563eb"/><text x="642" y="865" class="num" text-anchor="middle">D</text><rect x="704" y="840" width="260" height="100" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="722" y="872" class="h" text-anchor="start">Claude (Haiku)</text><text x="722" y="898" class="s" text-anchor="start">extract + draft only</text><circle cx="944" cy="860" r="13" fill="#2563eb"/><text x="944" y="865" class="num" text-anchor="middle">D</text><path d="M 792.0 766 L 792.0 800 L 512 800 L 512 838" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a2563eb)"/><path d="M 852.0 766 L 852.0 838" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a2563eb)"/><rect x="1006" y="840" width="290" height="100" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="1024" y="872" class="h" text-anchor="start">Postgres</text><text x="1024" y="898" class="s" text-anchor="start">runs, evidence, cost ledger</text><circle cx="1276" cy="860" r="13" fill="#059669"/><text x="1276" y="865" class="num" text-anchor="middle">$</text><path d="M 1154.0 766 L 1154.0 838" fill="none" stroke="#059669" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a059669)"/><rect x="40" y="840" width="270" height="100" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="58" y="872" class="h" text-anchor="start">Cloud Storage</text><text x="58" y="898" class="s" text-anchor="start">seller decks, deleted</text><text x="58" y="920" class="s" text-anchor="start">after 30 days</text><rect x="1380" y="840" width="180" height="100" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="1470.0" y="872.0" class="h" text-anchor="middle">Rules</text><text x="1470.0" y="897.0" class="s" text-anchor="middle">decide every</text><text x="1470.0" y="919.0" class="s" text-anchor="middle">status, not AI</text><circle cx="52" cy="977" r="12" fill="#2563eb"/><text x="52" y="982" class="num" text-anchor="middle">D</text><text x="72" y="982" class="s" text-anchor="start">Live data call</text><circle cx="241.0" cy="977" r="12" fill="#d97706"/><text x="241.0" y="982" class="num" text-anchor="middle">A</text><text x="261.0" y="982" class="s" text-anchor="start">Human approval</text><circle cx="430.0" cy="977" r="12" fill="#7c3aed"/><text x="430.0" y="982" class="num" text-anchor="middle">R</text><text x="450.0" y="982" class="s" text-anchor="start">Retry / resume</text><circle cx="619.0" cy="977" r="12" fill="#059669"/><text x="619.0" y="982" class="num" text-anchor="middle">$</text><text x="639.0" y="982" class="s" text-anchor="start">Cost ledger</text></svg>