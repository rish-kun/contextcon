</style><defs><marker id="a059669" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a2563eb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a475569" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker><marker id="a7c3aed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker><marker id="a94a3b8" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="ad97706" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker><marker id="adb2777" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#db2777"/></marker></defs><rect width="1600" height="960" fill="#ffffff"/><text x="40" y="52" class="title" text-anchor="start">DealProof · business architecture</text><text x="40" y="82" class="sub" text-anchor="start">The paid job, who pays for it, and what the buyer gets back.</text><text x="40" y="128" class="zone" text-anchor="start">TODAY</text><rect x="40" y="142" width="1520" height="120" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><rect x="64" y="160" width="330" height="84" rx="12" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/><text x="229.0" y="196.0" class="h" text-anchor="middle">Buyer</text><text x="229.0" y="221.0" class="s" text-anchor="middle">CFO office of a 3PL</text><path d="M 396 202 L 432 202" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a475569)"/><rect x="434" y="160" width="330" height="84" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="599.0" y="196.0" class="h" text-anchor="middle">pays an advisory firm</text><text x="599.0" y="221.0" class="s" text-anchor="middle">retainer or per target</text><path d="M 766 202 L 802 202" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a475569)"/><rect x="804" y="160" width="330" height="84" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="969.0" y="196.0" class="h" text-anchor="middle">analysts screen by hand</text><text x="969.0" y="221.0" class="s" text-anchor="middle">databases, deck, spreadsheet</text><path d="M 1136 202 L 1172 202" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a475569)"/><rect x="1174" y="160" width="330" height="84" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="1339.0" y="196.0" class="h" text-anchor="middle">memo after days</text><text x="1339.0" y="221.0" class="s" text-anchor="middle">claims often unchecked</text><text x="40" y="306" class="zone" text-anchor="start">WITH DEALPROOF</text><rect x="40" y="320" width="1520" height="300" rx="16" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/><rect x="64" y="344" width="230" height="150" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/><text x="179.0" y="401.0" class="h" text-anchor="middle">Request</text><text x="179.0" y="426.0" class="s" text-anchor="middle">a thesis, or a</text><text x="179.0" y="448.0" class="s" text-anchor="middle">company + its deck</text><path d="M 296 419 L 332 419" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a7c3aed)"/><rect x="334" y="344" width="220" height="150" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/><text x="444.0" y="401.0" class="h" text-anchor="middle">1  Discover</text><text x="444.0" y="426.0" class="s" text-anchor="middle">shortlist of</text><text x="444.0" y="448.0" class="s" text-anchor="middle">real companies</text><path d="M 556 419 L 580 419" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a7c3aed)"/><rect x="582" y="344" width="220" height="150" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/><text x="692.0" y="401.0" class="h" text-anchor="middle">2  Verify</text><text x="692.0" y="426.0" class="s" text-anchor="middle">each claim checked</text><text x="692.0" y="448.0" class="s" text-anchor="middle">against records</text><path d="M 804 419 L 828 419" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a7c3aed)"/><rect x="830" y="344" width="220" height="150" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/><text x="940.0" y="401.0" class="h" text-anchor="middle">3  Evaluate</text><text x="940.0" y="426.0" class="s" text-anchor="middle">rules give a</text><text x="940.0" y="448.0" class="s" text-anchor="middle">clear next step</text><path d="M 1052 419 L 1076 419" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a7c3aed)"/><rect x="1078" y="344" width="220" height="150" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="1188.0" y="401.0" class="h" text-anchor="middle">4  Act</text><text x="1188.0" y="426.0" class="s" text-anchor="middle">request documents</text><text x="1188.0" y="448.0" class="s" text-anchor="middle">after approval</text><circle cx="1278" cy="364" r="13" fill="#d97706"/><text x="1278" y="369" class="num" text-anchor="middle">A</text><rect x="1326" y="344" width="210" height="150" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="1431.0" y="401.0" class="h" text-anchor="middle">Finished case</text><text x="1431.0" y="426.0" class="s" text-anchor="middle">sourced, dated,</text><text x="1431.0" y="448.0" class="s" text-anchor="middle">ready to decide</text><path d="M 1300 419 L 1324 419" fill="none" stroke="#059669" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a059669)"/><rect x="1078" y="514" width="220" height="84" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="1188.0" y="550.0" class="h" text-anchor="middle">Named approver</text><text x="1188.0" y="575.0" class="s" text-anchor="middle">signs off first</text><path d="M 1188 512 L 1188 496" fill="none" stroke="#d97706" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#ad97706)"/><rect x="334" y="514" width="714" height="84" rx="12" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/><text x="691.0" y="550.0" class="h" text-anchor="middle">Analyst stays in charge</text><text x="691.0" y="575.0" class="s" text-anchor="middle">edits criteria, picks identity when names are ambiguous</text><rect x="1326" y="514" width="210" height="84" rx="12" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/><text x="1431.0" y="550.0" class="h" text-anchor="middle">Decision-maker</text><text x="1431.0" y="575.0" class="s" text-anchor="middle">second meeting: go?</text><path d="M 1431 496 L 1431 512" fill="none" stroke="#059669" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a059669)"/><text x="40" y="664" class="zone" text-anchor="start">COST PER JOB  (measured, live run, 22 Nov 2026)</text><rect x="40" y="678" width="740" height="250" rx="16" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="68" y="724" class="s" text-anchor="start">Verify one company (9 claims)</text><text x="752" y="724" class="big" text-anchor="end">8.7 credits</text><line x1="68" y1="740" x2="752" y2="740" stroke="#bbf7d0" stroke-width="1.5"/><text x="68" y="768" class="s" text-anchor="start">Shortlist of 25 companies</text><text x="752" y="768" class="big" text-anchor="end">50.1 credits</text><line x1="68" y1="784" x2="752" y2="784" stroke="#bbf7d0" stroke-width="1.5"/><text x="68" y="812" class="s" text-anchor="start">Find investors</text><text x="752" y="812" class="big" text-anchor="end">59.2 credits</text><line x1="68" y1="828" x2="752" y2="828" stroke="#bbf7d0" stroke-width="1.5"/><text x="68" y="856" class="s" text-anchor="start">All AI model calls</text><text x="752" y="856" class="big" text-anchor="end">$0.018</text><line x1="68" y1="872" x2="752" y2="872" stroke="#bbf7d0" stroke-width="1.5"/><text x="68" y="900" class="s" text-anchor="start">Budget cap per case</text><text x="752" y="900" class="big" text-anchor="end">150 credits</text><text x="820" y="664" class="zone" text-anchor="start">WHY A FIRM CAN TRUST IT</text><rect x="820" y="678" width="740" height="250" rx="16" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="848" y="724" class="s" text-anchor="start">✓  Every fact shows its source and date</text><text x="848" y="768" class="s" text-anchor="start">✓  “Cannot verify” instead of a guess</text><text x="848" y="812" class="s" text-anchor="start">✓  Lookalike names are never merged</text><text x="848" y="856" class="s" text-anchor="start">✓  Nothing is sent without a named approver</text><text x="848" y="900" class="s" text-anchor="start">✓  Uploaded files deleted after 30 days</text></svg>