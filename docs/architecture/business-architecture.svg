<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1330" width="1600" height="1330"><style>
text { font-family: 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif; fill: #0f172a; }
.title { font-size: 30px; font-weight: 700; }
.sub { font-size: 17px; fill: #64748b; }
.zone { font-size: 14px; font-weight: 700; fill: #64748b; letter-spacing: 1.6px; }
.h { font-size: 19px; font-weight: 700; }
.s { font-size: 16px; fill: #334155; }
.lab { font-size: 14px; fill: #64748b; }
.num { font-size: 14px; font-weight: 800; fill: #ffffff; }
.big { font-size: 20px; font-weight: 700; }
</style><defs><marker id="a059669" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a2563eb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a475569" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker><marker id="a7c3aed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker><marker id="a94a3b8" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="ad97706" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker><marker id="adb2777" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#db2777"/></marker></defs><rect width="1600" height="1330" fill="#ffffff"/><text x="40" y="52" class="title" text-anchor="start">DealProof · business architecture</text><text x="40" y="82" class="sub" text-anchor="start">The paid job, who pays for it today, what the service delivers, and what it costs.</text><text x="40" y="114" class="zone" text-anchor="start">TODAY · THE JOB A FIRM IS PAID FOR</text><rect x="40" y="128" width="1520" height="140" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><rect x="64" y="146" width="330" height="104" rx="12" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/><text x="229.0" y="180.0" class="h" text-anchor="middle">Buyer</text><text x="229.0" y="205.0" class="s" text-anchor="middle">CFO office of a mid-size</text><text x="229.0" y="227.0" class="s" text-anchor="middle">Indian 3PL</text><path d="M 396 198 L 432 198" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a475569)"/><rect x="434" y="146" width="330" height="104" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="599.0" y="180.0" class="h" text-anchor="middle">pays an advisory firm</text><text x="599.0" y="205.0" class="s" text-anchor="middle">M&amp;A advisor or diligence team,</text><text x="599.0" y="227.0" class="s" text-anchor="middle">retainer or fee per target</text><path d="M 766 198 L 802 198" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a475569)"/><rect x="804" y="146" width="330" height="104" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="969.0" y="180.0" class="h" text-anchor="middle">analysts screen by hand</text><text x="969.0" y="205.0" class="s" text-anchor="middle">databases, registry lookups,</text><text x="969.0" y="227.0" class="s" text-anchor="middle">seller deck, spreadsheet</text><path d="M 1136 198 L 1172 198" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a475569)"/><rect x="1174" y="146" width="330" height="104" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="1339.0" y="180.0" class="h" text-anchor="middle">memo after days</text><text x="1339.0" y="205.0" class="s" text-anchor="middle">claims unchecked, lookalike</text><text x="1339.0" y="227.0" class="s" text-anchor="middle">names mixed up, gaps guessed</text><text x="40" y="312" class="zone" text-anchor="start">WITH DEALPROOF · THE SAME JOB, DONE BY THE SERVICE</text><rect x="40" y="326" width="1520" height="360" rx="16" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/><rect x="64" y="346" width="200" height="190" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/><text x="164.0" y="399.0" class="h" text-anchor="middle">Request</text><text x="164.0" y="424.0" class="s" text-anchor="middle">a thesis, or a</text><text x="164.0" y="446.0" class="s" text-anchor="middle">company + website</text><text x="164.0" y="468.0" class="s" text-anchor="middle">+ seller deck, or a</text><text x="164.0" y="490.0" class="s" text-anchor="middle">business profile</text><path d="M 266 441 L 292 441" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a7c3aed)"/><rect x="294" y="346" width="240" height="190" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/><text x="414.0" y="399.0" class="h" text-anchor="middle">1  Discover</text><text x="414.0" y="424.0" class="s" text-anchor="middle">thesis → editable criteria</text><text x="414.0" y="446.0" class="s" text-anchor="middle">live company search</text><text x="414.0" y="468.0" class="s" text-anchor="middle">must-haves gate, rank fit</text><text x="414.0" y="490.0" class="s" text-anchor="middle">→ ranked shortlist</text><path d="M 536 441 L 556 441" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a7c3aed)"/><rect x="558" y="346" width="240" height="190" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/><text x="678.0" y="399.0" class="h" text-anchor="middle">2  Verify</text><text x="678.0" y="424.0" class="s" text-anchor="middle">confirm legal entity first</text><text x="678.0" y="446.0" class="s" text-anchor="middle">check each claim against</text><text x="678.0" y="468.0" class="s" text-anchor="middle">dated records</text><text x="678.0" y="490.0" class="s" text-anchor="middle">→ claim ledger</text><path d="M 800 441 L 820 441" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a7c3aed)"/><rect x="822" y="346" width="240" height="190" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/><text x="942.0" y="399.0" class="h" text-anchor="middle">3  Evaluate</text><text x="942.0" y="424.0" class="s" text-anchor="middle">5 separate judgments</text><text x="942.0" y="446.0" class="s" text-anchor="middle">decided by fixed rules</text><text x="942.0" y="468.0" class="s" text-anchor="middle">unknowns never penalised</text><text x="942.0" y="490.0" class="s" text-anchor="middle">→ next step + reason</text><path d="M 1064 441 L 1084 441" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a7c3aed)"/><rect x="1086" y="346" width="240" height="190" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="1206.0" y="399.0" class="h" text-anchor="middle">4  Act</text><text x="1206.0" y="424.0" class="s" text-anchor="middle">list docs that settle gaps</text><text x="1206.0" y="446.0" class="s" text-anchor="middle">draft one request email</text><text x="1206.0" y="468.0" class="s" text-anchor="middle">◆ named person approves</text><text x="1206.0" y="490.0" class="s" text-anchor="middle">→ sent exactly once</text><circle cx="1306" cy="366" r="13" fill="#d97706"/><text x="1306" y="371" class="num" text-anchor="middle">A</text><path d="M 1328 441 L 1334 441" fill="none" stroke="#059669" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a059669)"/><rect x="1336" y="346" width="200" height="190" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="1436.0" y="399.0" class="h" text-anchor="middle">Finished case</text><text x="1436.0" y="424.0" class="s" text-anchor="middle">identity confirmed</text><text x="1436.0" y="446.0" class="s" text-anchor="middle">each claim: status,</text><text x="1436.0" y="468.0" class="s" text-anchor="middle">source and date</text><text x="1436.0" y="490.0" class="s" text-anchor="middle">disposition + request</text><rect x="294" y="560" width="240" height="100" rx="12" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/><text x="414.0" y="592.0" class="h" text-anchor="middle">Analyst</text><text x="414.0" y="617.0" class="s" text-anchor="middle">edits criteria, picks</text><text x="414.0" y="639.0" class="s" text-anchor="middle">identity if ambiguous</text><rect x="558" y="560" width="504" height="100" rx="12" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/><text x="810.0" y="592.0" class="h" text-anchor="middle">Seller / target company</text><text x="810.0" y="617.0" class="s" text-anchor="middle">sends documents back → affected claims</text><text x="810.0" y="639.0" class="s" text-anchor="middle">re-checked, new assessment version</text><rect x="1086" y="560" width="240" height="100" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="1206.0" y="592.0" class="h" text-anchor="middle">Named approver</text><text x="1206.0" y="617.0" class="s" text-anchor="middle">approves the exact</text><text x="1206.0" y="639.0" class="s" text-anchor="middle">email; edits need re-approval</text><rect x="1336" y="560" width="200" height="100" rx="12" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/><text x="1436.0" y="592.0" class="h" text-anchor="middle">Decision-maker</text><text x="1436.0" y="617.0" class="s" text-anchor="middle">second meeting:</text><text x="1436.0" y="639.0" class="s" text-anchor="middle">go or no-go</text><path d="M 1206 558 L 1206 538" fill="none" stroke="#d97706" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#ad97706)"/><path d="M 1084 610 L 1064 610" fill="none" stroke="#d97706" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#ad97706)"/><path d="M 690 558 L 690 538" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#a7c3aed)"/><path d="M 1436 538 L 1436 558" fill="none" stroke="#059669" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a059669)"/><text x="40" y="730" class="zone" text-anchor="start">WHO BUYS IT</text><rect x="40" y="744" width="493" height="250" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="64" y="784" class="s" text-anchor="start">• M&amp;A advisory firms and corporate</text><text x="77" y="818" class="s" text-anchor="start">development teams (first customers)</text><text x="64" y="852" class="s" text-anchor="start">• PE and VC funds, family offices,</text><text x="77" y="886" class="s" text-anchor="start">search funds, business brokers</text><text x="64" y="920" class="s" text-anchor="start">• Businesses raising money: investors</text><text x="77" y="954" class="s" text-anchor="start">matched by their dated deals</text><text x="553" y="730" class="zone" text-anchor="start">A FINISHED CASE (ILLUSTRATION)</text><rect x="553" y="744" width="493" height="250" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="577" y="784" class="s" text-anchor="start">“Incorporated 2014, Pune”</text><text x="1022" y="784" class="h" text-anchor="end" style="fill:#059669">Supported</text><text x="577" y="822" class="s" text-anchor="start">“We employ 250 people”</text><text x="1022" y="822" class="h" text-anchor="end" style="fill:#64748b">Cannot verify</text><text x="577" y="860" class="s" text-anchor="start">“New facility, Oct 2026”</text><text x="1022" y="860" class="h" text-anchor="end" style="fill:#d97706">Partly corroborated</text><text x="577" y="898" class="s" text-anchor="start">“We have no debt”</text><text x="1022" y="898" class="h" text-anchor="end" style="fill:#64748b">Cannot verify</text><text x="577" y="956" class="h" text-anchor="start">→ Investigate further; ask for 3 documents</text><text x="1066" y="730" class="zone" text-anchor="start">BUSINESS MODEL</text><rect x="1066" y="744" width="493" height="250" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="1090" y="784" class="s" text-anchor="start">• Buyer pays per finished case, or a</text><text x="1103" y="818" class="s" text-anchor="start">monthly plan for a deal team</text><text x="1090" y="852" class="s" text-anchor="start">• Our cost per job: data credits,</text><text x="1103" y="886" class="s" text-anchor="start">AI tokens, cloud hosting</text><text x="1090" y="920" class="s" text-anchor="start">• Each run has a credit budget, so</text><text x="1103" y="954" class="s" text-anchor="start">cost per case is capped in advance</text><text x="40" y="1040" class="zone" text-anchor="start">COST PER JOB · MEASURED ON THE LIVE RUN, 22 NOV 2026</text><rect x="40" y="1054" width="740" height="256" rx="16" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="68" y="1096" class="s" text-anchor="start">Verify one company (9 claims)</text><text x="752" y="1096" class="big" text-anchor="end">8.7 credits</text><line x1="68" y1="1114" x2="752" y2="1114" stroke="#bbf7d0" stroke-width="1.5"/><text x="68" y="1142" class="s" text-anchor="start">Shortlist of 25 companies (shared by its cases)</text><text x="752" y="1142" class="big" text-anchor="end">50.1 credits</text><line x1="68" y1="1160" x2="752" y2="1160" stroke="#bbf7d0" stroke-width="1.5"/><text x="68" y="1188" class="s" text-anchor="start">Find investors for a business</text><text x="752" y="1188" class="big" text-anchor="end">59.2 credits</text><line x1="68" y1="1206" x2="752" y2="1206" stroke="#bbf7d0" stroke-width="1.5"/><text x="68" y="1234" class="s" text-anchor="start">All AI model calls in the run</text><text x="752" y="1234" class="big" text-anchor="end">$0.018</text><line x1="68" y1="1252" x2="752" y2="1252" stroke="#bbf7d0" stroke-width="1.5"/><text x="68" y="1280" class="s" text-anchor="start">Default budget cap per case</text><text x="752" y="1280" class="big" text-anchor="end">150 credits</text><text x="820" y="1040" class="zone" text-anchor="start">WHY A FIRM CAN TRUST IT</text><rect x="820" y="1054" width="740" height="256" rx="16" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="848" y="1094" class="s" text-anchor="start">✓  Every fact shows its source link and date</text><text x="848" y="1131" class="s" text-anchor="start">✓  “Cannot verify” instead of a guess, naming what is missing</text><text x="848" y="1168" class="s" text-anchor="start">✓  Lookalike names are never merged</text><text x="848" y="1205" class="s" text-anchor="start">✓  Same evidence + same rules → same result</text><text x="848" y="1242" class="s" text-anchor="start">✓  Nothing is sent without a named approver, and only once</text><text x="848" y="1279" class="s" text-anchor="start">✓  Uploads stay in their case and are deleted after 30 days</text></svg>