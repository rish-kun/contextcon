<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1060" width="1500" height="1060">
<style>
  text { font-family: 'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif; fill: #0f172a; }
  .title { font-size: 26px; font-weight: 700; }
  .sub { font-size: 15px; fill: #475569; }
  .h { font-size: 16px; font-weight: 700; }
  .s { font-size: 14px; fill: #1e293b; }
  .m { font-family: Consolas, 'Cascadia Mono', 'Courier New', monospace; font-size: 13px; fill: #1e293b; }
  .lab { font-size: 13px; fill: #475569; font-style: italic; }
  .lane { font-size: 13px; font-weight: 700; fill: #475569; letter-spacing: 1.5px; }
  .badge { font-size: 13px; font-weight: 800; fill: #ffffff; }
  .gate { font-size: 14px; font-weight: 800; fill: #b45309; }
</style>
<defs><marker id="ah-db2777" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#db2777"/></marker><marker id="ah-d97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker><marker id="ah-ea580c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ea580c"/></marker><marker id="ah-94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="ah-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="ah-059669" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="ah-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker><marker id="ah-475569" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker></defs><rect width="1500" height="1060" fill="#ffffff"/><text x="20" y="38" class="title" text-anchor="start">DealProof — business architecture</text><text x="20" y="60" class="sub" text-anchor="start">The paid job, who pays for it today, and how a request becomes a finished, sourced screening case</text><rect x="10" y="78" width="1480" height="170" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.6"/><text x="26" y="102" class="lane" text-anchor="start">TODAY — THE JOB A FIRM IS PAID FOR</text><rect x="26" y="114" width="290" height="120" rx="10" fill="#fdf2f8" stroke="#db2777" stroke-width="1.6"/><text x="40" y="139" class="h" text-anchor="start">Buyer: CFO office / corp-dev</text><text x="40" y="161" class="s" text-anchor="start">mid-size Indian 3PL looking at</text><text x="40" y="181" class="s" text-anchor="start">logistics, warehousing and</text><text x="40" y="201" class="s" text-anchor="start">supply-chain tech targets</text><rect x="380" y="114" width="290" height="120" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/><text x="394" y="139" class="h" text-anchor="start">Paid firm</text><text x="394" y="161" class="s" text-anchor="start">M&amp;A advisory, diligence team</text><text x="394" y="181" class="s" text-anchor="start">or venture scout; paid a</text><text x="394" y="201" class="s" text-anchor="start">retainer or per-target fee</text><rect x="734" y="114" width="340" height="120" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/><text x="748" y="139" class="h" text-anchor="start">Manual first-pass screening</text><text x="748" y="161" class="s" text-anchor="start">databases + registry lookups,</text><text x="748" y="181" class="s" text-anchor="start">reading the seller deck,</text><text x="748" y="201" class="s" text-anchor="start">an analyst&#x27;s spreadsheet</text><rect x="1138" y="114" width="336" height="120" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/><text x="1152" y="139" class="h" text-anchor="start">What goes wrong</text><text x="1152" y="161" class="s" text-anchor="start">days per target · deck claims</text><text x="1152" y="181" class="s" text-anchor="start">unchecked · lookalike names</text><text x="1152" y="201" class="s" text-anchor="start">mixed up · gaps filled by guesses</text><path d="M 316 174 L 378 174" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ah-475569)"/><text x="322" y="166" class="lab" text-anchor="start">pays fee</text><path d="M 670 174 L 732 174" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ah-475569)"/><path d="M 1074 174 L 1136 174" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ah-475569)"/><rect x="10" y="266" width="1480" height="446" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/><text x="26" y="290" class="lane" text-anchor="start">WITH DEALPROOF — THE SAME JOB, DONE BY THE SERVICE</text><rect x="26" y="304" width="230" height="290" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/><text x="40" y="329" class="h" text-anchor="start">Request (input)</text><text x="40" y="353" class="s" text-anchor="start">• an investment thesis</text><text x="40" y="375" class="s" text-anchor="start">  in plain words, or</text><text x="40" y="397" class="s" text-anchor="start">• a company name +</text><text x="40" y="419" class="s" text-anchor="start">  website, and</text><text x="40" y="441" class="s" text-anchor="start">• optional seller deck</text><text x="40" y="463" class="s" text-anchor="start">  or typed claims</text><text x="40" y="485" class="s" text-anchor="start">• or a business profile</text><text x="40" y="507" class="s" text-anchor="start">  (to find investors)</text><rect x="290" y="304" width="210" height="200" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/><text x="304" y="329" class="h" text-anchor="start">1 · Discover</text><text x="304" y="355" class="s" text-anchor="start">criteria you can edit</text><text x="304" y="379" class="s" text-anchor="start">live company search</text><text x="304" y="403" class="s" text-anchor="start">must-haves gate, then</text><text x="304" y="427" class="s" text-anchor="start">rank by fit</text><text x="304" y="451" class="s" text-anchor="start"></text><text x="304" y="475" class="s" text-anchor="start">→ sourced shortlist</text><path d="M 256 400 L 289 400" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#ah-7c3aed)"/><rect x="522" y="304" width="210" height="200" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/><text x="536" y="329" class="h" text-anchor="start">2 · Verify</text><text x="536" y="355" class="s" text-anchor="start">confirm legal identity</text><text x="536" y="379" class="s" text-anchor="start">first (no name-only</text><text x="536" y="403" class="s" text-anchor="start">matches), check each</text><text x="536" y="427" class="s" text-anchor="start">claim vs evidence</text><text x="536" y="451" class="s" text-anchor="start"></text><text x="536" y="475" class="s" text-anchor="start">→ claim ledger</text><path d="M 501 400 L 521 400" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#ah-7c3aed)"/><rect x="754" y="304" width="210" height="200" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/><text x="768" y="329" class="h" text-anchor="start">3 · Evaluate</text><text x="768" y="355" class="s" text-anchor="start">5 separate judgments,</text><text x="768" y="379" class="s" text-anchor="start">rules not AI opinion;</text><text x="768" y="403" class="s" text-anchor="start">unknowns stated,</text><text x="768" y="427" class="s" text-anchor="start">never penalised</text><text x="768" y="451" class="s" text-anchor="start"></text><text x="768" y="475" class="s" text-anchor="start">→ disposition</text><path d="M 733 400 L 753 400" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#ah-7c3aed)"/><rect x="986" y="304" width="210" height="200" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/><text x="1000" y="329" class="h" text-anchor="start">4 · Act</text><text x="1000" y="355" class="s" text-anchor="start">list the documents that</text><text x="1000" y="379" class="s" text-anchor="start">settle open questions,</text><text x="1000" y="403" class="s" text-anchor="start">draft one request,</text><text x="1000" y="427" class="gate" text-anchor="start">◆ person approves</text><text x="1000" y="451" class="s" text-anchor="start"></text><text x="1000" y="475" class="s" text-anchor="start">→ sent exactly once</text><circle cx="1178" cy="322" r="12" fill="#d97706"/><text x="1178" y="326.5" class="badge" text-anchor="middle">A</text><path d="M 965 400 L 985 400" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#ah-7c3aed)"/><rect x="1236" y="304" width="238" height="290" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/><text x="1250" y="329" class="h" text-anchor="start">Finished result</text><text x="1250" y="353" class="s" text-anchor="start">a screening case that</text><text x="1250" y="375" class="s" text-anchor="start">reads in minutes and</text><text x="1250" y="397" class="s" text-anchor="start">audits in full:</text><text x="1250" y="419" class="s" text-anchor="start">• identity + profile</text><text x="1250" y="441" class="s" text-anchor="start">• each claim: status,</text><text x="1250" y="463" class="s" text-anchor="start">  quote/field, date</text><text x="1250" y="485" class="s" text-anchor="start">• Prioritise / Investigate</text><text x="1250" y="507" class="s" text-anchor="start">  / Deprioritise / Cannot</text><text x="1250" y="529" class="s" text-anchor="start">  assess, with reasons</text><text x="1250" y="551" class="s" text-anchor="start">• request list + email</text><path d="M 1196 400 L 1234 400" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#ah-059669)"/><rect x="290" y="524" width="450" height="70" rx="10" fill="#fdf2f8" stroke="#db2777" stroke-width="1.6"/><text x="304" y="549" class="h" text-anchor="start">Analyst (user)</text><text x="304" y="570" class="s" text-anchor="start">edits criteria, picks identity when ambiguous, reads the case</text><rect x="756" y="524" width="462" height="70" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/><text x="770" y="549" class="h" text-anchor="start">Named approver</text><text x="770" y="570" class="s" text-anchor="start">approves the exact email revision; any edit needs a new approval</text><circle cx="1200" cy="542" r="12" fill="#d97706"/><text x="1200" y="546.5" class="badge" text-anchor="middle">A</text><rect x="26" y="610" width="520" height="86" rx="10" fill="#fdf2f8" stroke="#db2777" stroke-width="1.6"/><text x="40" y="635" class="h" text-anchor="start">Seller / target company</text><text x="40" y="656" class="s" text-anchor="start">gets one consolidated document request;</text><text x="40" y="675" class="s" text-anchor="start">documents it returns re-check the affected claims</text><rect x="562" y="610" width="912" height="86" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/><text x="576" y="635" class="h" text-anchor="start">Decision-maker (buyer&#x27;s CFO office)</text><text x="576" y="656" class="s" text-anchor="start">goes into the second meeting with claims checked and unknowns named; earlier assessment kept,</text><text x="576" y="675" class="s" text-anchor="start">and every change between versions explained (e.g. &#x27;Partially corroborated → Supported because …&#x27;)</text><path d="M 1110 504 L 1110 522" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#ah-d97706)"/><path d="M 1355 594 L 1355 608" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#ah-059669)"/><path d="M 800 594 L 800 602 L 520 602 L 520 608" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#ah-d97706)"/><rect x="10" y="730" width="735" height="312" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/><text x="26" y="754" class="lane" text-anchor="start">ECONOMICS — MEASURED ON THE LIVE SHOWCASE RUN (22 NOV 2026)</text><text x="30" y="790" class="s" text-anchor="start">Verify + evaluate one case (Palms WMS, 9 claims)</text><text x="720" y="790" class="h" text-anchor="end">8.7 Crustdata credits</text><line x1="30" y1="802" x2="720" y2="802" stroke="#bbf7d0"/><text x="30" y="824" class="s" text-anchor="start">Discover: thesis → 25 enriched companies</text><text x="720" y="824" class="h" text-anchor="end">50.1 credits, shared</text><line x1="30" y1="836" x2="720" y2="836" stroke="#bbf7d0"/><text x="30" y="858" class="s" text-anchor="start">Investor search for the same profile</text><text x="720" y="858" class="h" text-anchor="end">59.2 credits</text><line x1="30" y1="870" x2="720" y2="870" stroke="#bbf7d0"/><text x="30" y="892" class="s" text-anchor="start">All LLM calls for the whole showcase</text><text x="720" y="892" class="h" text-anchor="end">$0.018 (≈ ₹1.5)</text><line x1="30" y1="904" x2="720" y2="904" stroke="#bbf7d0"/><text x="30" y="926" class="s" text-anchor="start">Budget caps (configurable)</text><text x="720" y="926" class="h" text-anchor="end">case 150 · discover 100</text><line x1="30" y1="938" x2="720" y2="938" stroke="#bbf7d0"/><text x="30" y="960" class="s" text-anchor="start">Who pays (proposed)</text><text x="720" y="960" class="h" text-anchor="end">per finished case, or</text><line x1="30" y1="972" x2="720" y2="972" stroke="#bbf7d0"/><text x="30" y="994" class="s" text-anchor="start"></text><text x="720" y="994" class="h" text-anchor="end">monthly plan for a deal team</text><circle cx="712" cy="748" r="12" fill="#059669"/><text x="712" y="752.5" class="badge" text-anchor="middle">$</text><rect x="760" y="730" width="730" height="312" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/><text x="776" y="754" class="lane" text-anchor="start">TRUST — WHY A FIRM CAN SIGN OFF ON IT</text><text x="780" y="790" class="s" text-anchor="start">✓  Every fact links to its record: URL or API field, exact passage, and date</text><text x="780" y="824" class="s" text-anchor="start">✓  &#x27;Cannot verify&#x27; is a real answer and names the document that would settle it</text><text x="780" y="858" class="s" text-anchor="start">✓  Identity first: lookalike names stay separate; nothing attaches on a name alone</text><text x="780" y="892" class="s" text-anchor="start">✓  Rules decide; same records + same policy version → same assessment</text><text x="780" y="926" class="s" text-anchor="start">✓  Nothing leaves without a named approver, and it leaves once</text><text x="780" y="960" class="s" text-anchor="start">✓  Uploads: case-only, personal details stripped, deleted after 30 days</text><text x="780" y="994" class="s" text-anchor="start">✓  Web searches use public lookup terms only, never confidential claim text</text></svg>